{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your FluentAI account password.">
    <title>Password reset - FluentAI</title>
    <link rel="icon" href="{% static 'images/logo-icon.jpg' %}" type="image/jpeg">
    <link rel="stylesheet" href="{% static 'css/design-system.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/redesign.css' %}">
    <style>
        [hidden] { display: none !important; }
        .reset-message { display: none; margin: 0 0 var(--space-4); }
        .reset-message.show { display: flex; }
        .auth-error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #f87171; padding: 10px 14px; border-radius: 10px; font-size: 13px; }
        .auth-success { background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); color: #34d399; padding: 10px 14px; border-radius: 10px; font-size: 13px; }
        .reset-back { display: inline-block; margin-top: var(--space-5); color: var(--accent-primary); }
    </style>
</head>
<body>
    <main class="auth-layout">
        <section class="glass-card auth-card animate-scale-in" aria-labelledby="resetTitle">
            <header class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div class="nav-logo-icon"><img src="{% static 'images/logo.jpg' %}" alt=""></div>
                    <span class="nav-logo-text">Fluent<span>AI</span></span>
                </a>
                <h1 class="auth-title" id="resetTitle">Reset your password</h1>
                <p class="auth-subtitle" id="resetSubtitle">We’ll email you a link to choose a new password.</p>
            </header>

            <div class="auth-error reset-message" id="resetError" role="alert"><span id="resetErrorText"></span></div>
            <div class="auth-success reset-message" id="resetSuccess" role="status"><span id="resetSuccessText"></span></div>

            <form class="auth-form" id="requestResetForm">
                <div>
                    <label class="input-label" for="resetEmail">Email</label>
                    <input class="input" type="email" id="resetEmail" autocomplete="email" required maxlength="254">
                </div>
                <button class="btn btn-primary btn-lg" id="requestResetButton" type="submit" style="width:100%; margin-top:var(--space-4);">Send reset link</button>
            </form>

            <form class="auth-form" id="confirmResetForm" hidden>
                <div>
                    <label class="input-label" for="newPassword">New password</label>
                    <input class="input" type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
                </div>
                <div>
                    <label class="input-label" for="confirmPassword">Confirm new password</label>
                    <input class="input" type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
                </div>
                <button class="btn btn-primary btn-lg" id="confirmResetButton" type="submit" style="width:100%; margin-top:var(--space-4);">Save new password</button>
            </form>

            <a class="reset-back" href="login.html">Back to log in</a>
        </section>
    </main>
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/password-reset.js' %}"></script>
</body>
</html>
