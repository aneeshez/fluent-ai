<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FluentAI</title>
    <link rel="icon" href="images/logo-icon.jpg" type="image/jpeg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/layout.css">

    <style>
        .auth-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        .auth-error.show {
            display: flex;
        }

        .auth-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        .auth-success.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--text-primary);
        }

        .input-label {
            display: block;
            font-size: var(--text-sm);
            margin-bottom: var(--space-2);
            color: var(--text-secondary);
        }

        .auth-social-btn {
            transition: all 0.2s ease;
        }

        .auth-social-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-loading {
            position: relative;
            color: transparent !important;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .input:focus {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .input.error {
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .password-strength {
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .password-strength-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease, background 0.3s ease;
            width: 0%;
        }
    </style>
    <link rel="stylesheet" href="css/redesign.css?v=night-v7">
</head>

<body>
    <div class="auth-layout">
        <div class="glass-card auth-card animate-scale-in">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div class="nav-logo-icon"><img src="images/logo.jpg" alt="FluentAI"></div>
                    <span class="nav-logo-text">Fluent<span>AI</span></span>
                </a>
                <h1 class="auth-title">Create your account</h1>
                <p class="auth-subtitle">Start your English learning journey today</p>
            </div>

            <!-- Error/Success Messages -->
            <div class="auth-error" id="authError">
                <span></span>
                <span id="errorText">Something went wrong</span>
            </div>
            <div class="auth-success" id="authSuccess">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                <span id="successText">Account created!</span>
            </div>

            <!-- Google Sign-Up -->
            <div class="auth-social">
                <button class="auth-social-btn" id="googleSignUp">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Sign up with Google
                </button>
            </div>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <!-- Email Form -->
            <form class="auth-form" id="signupForm" novalidate>
                <div>
                    <label class="input-label" for="name">Full Name</label>
                    <input type="text" class="input" placeholder="John Doe" required id="name" autocomplete="name">
                </div>

                <div>
                    <label class="input-label" for="email">Email</label>
                    <input type="email" class="input" placeholder="you@example.com" required id="email"
                        autocomplete="email">
                </div>

                <div>
                    <label class="input-label" for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="input" placeholder="••••••••" required id="password" minlength="8"
                            autocomplete="new-password">
                        <button type="button" class="password-toggle" id="passToggle" title="Show password"></button>
                    </div>
                    <div class="password-strength">
                        <div class="password-strength-fill" id="passwordStrength"></div>
                    </div>
                    <p style="font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--space-1);"
                        id="passwordHint">At least 8 characters</p>
                </div>

                <div style="display: flex; align-items: flex-start; gap: var(--space-3); margin-top: var(--space-2);">
                    <input type="checkbox" id="terms" required style="margin-top: 4px; accent-color: #6366F1;">
                    <label for="terms" style="font-size: var(--text-sm); color: var(--text-muted);">
                        I agree to the <a href="#" style="color: var(--accent-primary);">Terms of Service</a> and <a
                            href="#" style="color: var(--accent-primary);">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="signupBtn"
                    style="width: 100%; margin-top: var(--space-4);">
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                <p style="color: var(--text-muted);">
                    Already have an account? <a href="login.html">Log in</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
